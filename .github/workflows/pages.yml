name: Deploy Unity WebGL
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack complete runtime
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, tarfile
          manifest = json.loads(pathlib.Path('release-manifest.json').read_text())
          with open('game.tar.gz', 'wb') as output:
              for part in manifest['parts']:
                  data = pathlib.Path(part['file']).read_bytes()
                  assert len(data) == part['bytes'], part['file']
                  assert hashlib.sha256(data).hexdigest() == part['sha256'], part['file']
                  output.write(data)
          assert hashlib.sha256(pathlib.Path('game.tar.gz').read_bytes()).hexdigest() == manifest['archive_sha256']
          pathlib.Path('_site').mkdir(exist_ok=True)
          with tarfile.open('game.tar.gz') as archive:
              archive.extractall('_site', filter='data')
          assert pathlib.Path('_site/index.html').is_file()
          PY
      - name: Apply interaction update
        run: |
          python3 -m pip install bsdiff4==1.3.1
          python3 - <<'PY'
          import gzip, hashlib, json, pathlib, tarfile, bsdiff4
          with tarfile.open('interaction-update.tar.gz') as archive:
              archive.extractall('_site', filter='data')
          patch_path = pathlib.Path('_site/data-patch.json')
          patch = json.loads(patch_path.read_text())
          data_path = pathlib.Path('_site/Build/web.data.unityweb')
          data = bytearray(gzip.decompress(data_path.read_bytes()))
          assert hashlib.sha256(data).hexdigest() == patch['base']
          data = bsdiff4.patch(bytes(data), pathlib.Path('_site/data.bsdiff').read_bytes())
          assert hashlib.sha256(data).hexdigest() == patch['result']
          compressed = gzip.compress(data, compresslevel=9, mtime=0)
          compressed = compressed[:3] + bytes([16]) + compressed[4:10] + b'UnityWeb Compressed Content (gzip)\x00' + compressed[10:]
          data_path.write_bytes(compressed)
          patch_path.unlink()
          pathlib.Path('_site/data.bsdiff').unlink()
          index_path = pathlib.Path('_site/index.html')
          html = index_path.read_text()
          for asset in pathlib.Path('_site/Build').iterdir():
              renamed = 'interactionv4-' + asset.name
              html = html.replace('Build/' + asset.name, 'Build/' + renamed)
              asset.rename(asset.with_name(renamed))
          index_path.write_text(html)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
